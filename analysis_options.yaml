include: package:flutter_lints/flutter.yaml

# Contract: docs/ARCHITECTURE.md §9.
#
# TODO(R.5): turn on strict-casts / strict-inference / strict-raw-types once the
# screens stop using untyped Maps (today: 73 / 15 / 24 findings, all in
# screens and services that the refactor rewrites in R.4). Also remove the
# deprecated_member_use ignore when withOpacity is migrated to withValues.
analyzer:
  errors:
    deprecated_member_use: ignore
    # freezed puts @JsonKey on factory parameters; the analyzer flags that
    # although json_serializable reads it correctly.
    invalid_annotation_target: ignore
  plugins:
    - custom_lint

custom_lint:
  rules:
    # The DI and repository providers (docs/ARCHITECTURE.md §3) are written by
    # hand (`Provider<...>`); controllers are generated and depend on them.
    - avoid_manual_providers_as_generated_provider_dependency: false
