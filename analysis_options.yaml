include: package:flutter_lints/flutter.yaml

# Contract: docs/ARCHITECTURE.md §9.
#
# TODO(R.5): turn on strict-casts / strict-inference / strict-raw-types once the
# screens stop using untyped Maps (today: 73 / 15 / 24 findings, all in
# screens and services that the refactor rewrites in R.4). Also remove the
# deprecated_member_use ignore when withOpacity is migrated to withValues.
analyzer:
  errors:
    deprecated_member_use: ignore
  plugins:
    - custom_lint

custom_lint:
  rules:
    # TODO(R.4, trip/tracking step): turn this rule back on. TripTrackingNotifier
    # exposes a public `tripId` getter used across the app; it is restructured
    # in that step.
    - avoid_public_notifier_properties: false
