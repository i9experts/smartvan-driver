name: Flutter CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build -d

      - name: Generated code is committed
        run: git diff --exit-code

      - name: core/ must not import features/
        run: |
          if grep -rnE "^(import|export) .*(/|')features/" lib/core; then
            echo "lib/core must not import features/ (docs/ARCHITECTURE.md §2)"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Riverpod lints
        run: dart run custom_lint

      - name: Test
        run: flutter test
